[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoryn"
version = "0.1.0"
description = "A continually learning Early Warning System for Earth systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Simon Mutunga" }
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",

    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "scipy>=1.13",
    "shapely>=2.0",

    "openai>=2.0"
]

[project.optional-dependencies]
# Ad-hoc tools under scripts/ (ClimateSERV prototype, parquet checks).
scripts = [
    "requests>=2.31",
    "psutil>=5.9"
]

dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false